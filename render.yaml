# Render Blueprint: ein Node-Webdienst in Frankfurt, Deploy bei jedem Push.
# Free schläft nach 15 min ohne Besucher ein; zum Shop-Start auf starter wechseln.
services:
  - type: web
    name: pronoia
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SHOP_ENABLED
        value: "false"
      - key: STRIPE_PRICE_BODY
        value: price_1UIxe8RXEmDshqwo7d39s2m8
      - key: STRIPE_PRICE_MIND
        value: price_1UIxeBRXEmDshqwoBsRSrujA
      - key: STRIPE_PRICE_SET
        value: price_1UIxeDRXEmDshqwo18xwdrHu
      - key: RESEND_SEGMENT_ID
        value: cda9f461-a958-4bd8-ade3-576bbb722174
      - key: RESEND_FROM
        value: "pronoia <onboarding@resend.dev>"
      - key: ORDER_NOTIFY_EMAIL
        value: pronoia_company@proton.me
      - key: NEWSLETTER_SECRET
        generateValue: true
      # Geheime Werte fragt Render beim Anlegen ab; sie landen nie im Repo.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
